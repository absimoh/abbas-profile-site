<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111411"><title>Abbas Al-Mokhtafi</title><meta name="description" content="Meet Abbas Al-Mokhtafi and connect on social media."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><style>

round .15s}.social:hover{background:#c2dbb7;transform:translateY(-1px)}.footer{height:64px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px}.footer a{color:var(--muted)}[dir=rtl] body{font-family:'Noto Sans Arabic','DM Sans',sans-serif}[dir=rtl] .profile{direction:rtl}[dir=rtl] h1{letter-spacing:0;font-family:'Noto Sans Arabic',sans-serif}[dir=rtl] .footer{direction:rtl}

</style></head><body><div class="wrap"><header class="top"><a class="brand" id="brand" href="./">Abbas.</a><a class="language" id="language" href="?lang=ar">العربية</a></header><main class="main"><section class="profile"><div class="copy"><div class="eyebrow"><span class="dot"></span><span id="availability">Open to meaningful connections</span></div><h1 id="name">Abbas Al-Mokhtafi</h1><p class="tagline" id="tagline"></p><p class="bio" id="bio"></p><p class="location" id="location"></p><div class="contacts"><div class="contact-title" id="contactTitle">Find me on</div><div class="links" id="links"></div></div></div><div class="portrait" id="portrait" aria-label="Profile photo"><span id="initials">AM</span></div></section></main><footer class="footer"><span>© <span id="year"></span> <span id="footerName">Abbas Al-Mokhtafi</span></span></footer></div><script>
const labels={en:{availability:'Open to meaningful connections',contact:'Find me on',location:'Based in',linkedin:'LinkedIn',instagram:'Instagram',snapchat:'Snapchat',whatsapp:'WhatsApp',email:'Email'},ar:{availability:'يسعدني التواصل وتبادل الأفكار',contact:'تواصل معي',location:'الموقع',linkedin:'لينكدإن',instagram:'إنستغرام',snapchat:'سناب شات',whatsapp:'واتساب',email:'البريد الإلكتروني'}};const lang=new URLSearchParams(location.search).get('lang')==='ar'?'ar':'en';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('language').textContent=lang==='en'?'العربية':'English';document.getElementById('language').href=lang==='en'?'?lang=ar':'?lang=en';document.getElementById('availability').textContent=labels[lang].availability;document.getElementById('contactTitle').textContent=labels[lang].contact;document.getElementById('year').textContent=new Date().getFullYear();function text(v){return typeof v==='string'?v:(v?.[lang]||v?.en||'')}function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(d){const name=text(d.name)||'Abbas Al-Mokhtafi';document.title=name;document.getElementById('name').textContent=name;document.getElementById('footerName').textContent=name;document.getElementById('brand').textContent=name.split(' ')[0]+'.';document.getElementById('tagline').textContent=text(d.tagline);document.getElementById('bio').textContent=text(d.bio);const loc=text(d.location);document.getElementById('location').textContent=loc?(labels[lang].location+': '+loc):'';const portrait=document.getElementById('portrait');if(d.photoUrl){portrait.innerHTML='<img src="'+safe(d.photoUrl)+'" alt="'+safe(name)+'">'}else{document.getElementById('initials').textContent=name.split(/\s+/).map(x=>x[0]).slice(0,2).join('')}const rows=[['linkedin',d.linkedin],['instagram',d.instagram],['snapchat',d.snapchat],['whatsapp',d.whatsapp]].filter(x=>x[1]);document.getElementById('links').innerHTML=rows.map(([k,u])=>'<a class="social" href="'+safe(u)+'" '+(k==='email'?'':'target="_blank" rel="noreferrer"')+'>'+labels[lang][k]+' ↗</a>').join('')}async function load(){let d={};try{const r=await fetch('./content.json');d=await r.json()}catch(e){}try{const c=window.SITE_CONFIG;if(window.supabase&&c?.supabaseUrl?.startsWith('https://')&&c?.supabaseAnonKey&&!c.supabaseAnonKey.includes('YOUR_')){const db=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);const {data,error}=await db.from('profile_content').select('content').eq('id',1).maybeSingle();if(!error&&data?.content)d=data.content}}catch(e){}render(d)}load();
</script></body></html>
